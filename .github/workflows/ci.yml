name: macOS checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly native render regression check against the previous passed render.
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      native_render:
        description: Run the isolated synthetic native render smoke check
        type: boolean
        default: false
      render_baseline:
        description: Compare native renders with the previous passed run (clear to record a new reference after review)
        type: boolean
        default: true
      thread_sanitizer:
        description: Run the concurrency-heavy Swift suites under Thread Sanitizer
        type: boolean
        default: false
      synthetic_performance:
        description: Measure the synthetic large archive and session workload
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  check:
    # The weekly schedule only runs the native render comparison.
    if: github.event_name != 'schedule'
    runs-on: macos-26
    # 40 successful runs up to 2026-09-27 took 5.4-11.7 min (median 8.5).
    # check-results.json now records per-stage durations; revisit from those.
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Obtain pinned XcodeGen
        run: |
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip --output "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/project-tools"
      - name: Verify generated project parity without source mutation
        run: python3 scripts/check-project-parity.py --xcodegen "$RUNNER_TEMP/project-tools/xcodegen/bin/xcodegen"
      - name: Test and build app with WidgetKit
        run: WEEKLEFT_CHECK_RESULTS="$RUNNER_TEMP/lunavect-check-results" ./scripts/check.sh
      - name: Summarize passed, skipped and not-run checks
        if: always()
        run: |
          for report in "$RUNNER_TEMP"/lunavect-check-results/run.*/check-summary.md; do
            if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Preserve unsigned check evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-check-${{ github.sha }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lunavect-check-results/run.*/check-results.json
            ${{ runner.temp }}/lunavect-check-results/run.*/check-summary.md
            ${{ runner.temp }}/lunavect-check-results/run.*/build-manifest.json
          retention-days: 14
          if-no-files-found: warn

  native-render:
    strategy:
      fail-fast: false
      matrix:
        suite: [smoke, legacy-values]
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.native_render)
    runs-on: macos-26
    # No completed CI render yet: a test-product build plus two isolated
    # language renders; tighten once real durations are known.
    timeout-minutes: 30
    permissions:
      contents: read
      # Read earlier runs' render artifacts for the baseline; nothing is written.
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Find the previous passed render of this suite
        id: baseline
        if: github.event_name == 'schedule' || inputs.render_baseline
        env:
          GH_TOKEN: ${{ github.token }}
          SUITE: ${{ matrix.suite }}
        run: |
          # Only runs on main count; a dispatch on another branch compares against them.
          baseline=$(python3 scripts/find-render-baseline.py --repository "$GITHUB_REPOSITORY" --workflow ci.yml \
            --branch main --suite "$SUITE" --arch "$RUNNER_ARCH" --exclude-run "$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/native-render-baseline" --summary "$GITHUB_STEP_SUMMARY")
          echo "path=$baseline" >> "$GITHUB_OUTPUT"
      - name: Render isolated synthetic states
        env:
          SUITE: ${{ matrix.suite }}
          BASELINE: ${{ steps.baseline.outputs.path }}
        run: |
          arguments=(--run --require-render --suite "$SUITE" --output "$RUNNER_TEMP/native-renders")
          if [ -n "$BASELINE" ]; then arguments+=(--baseline "$BASELINE"); fi
          python3 scripts/check-native-renders.py "${arguments[@]}"
      - name: Summarize synthetic render scope
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/native-renders/summary.md" ]; then
            cat "$RUNNER_TEMP/native-renders/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve synthetic render evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: synthetic-native-render-${{ matrix.suite }}-${{ github.sha }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-renders/render-report.json
            ${{ runner.temp }}/native-renders/summary.md
            ${{ runner.temp }}/native-renders/build-manifest.json
            ${{ runner.temp }}/native-renders/gallery.html
            ${{ runner.temp }}/native-renders/images/*.png
            ${{ runner.temp }}/native-renders/baseline/*.png
          # Outlives two missed weekly runs, so a baseline is still available.
          retention-days: 35
          if-no-files-found: warn

  thread-sanitizer:
    if: github.event_name == 'workflow_dispatch' && inputs.thread_sanitizer
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run concurrency-heavy suites under Thread Sanitizer
        run: |
          set -o pipefail
          swift test --jobs 2 --sanitize=thread \
            --filter 'IDEBridgeTests|LocalFileCacheTests|SessionStoreLifecycleTests|AppStoreLifecycleTests|ActivityServiceTests' \
            2>&1 | tee "$RUNNER_TEMP/thread-sanitizer.log"
      - name: Summarize Thread Sanitizer result
        if: always()
        run: |
          log="$RUNNER_TEMP/thread-sanitizer.log"
          if [ -f "$log" ]; then
            totals=$(grep -E 'Executed [0-9]+ tests?' "$log" | tail -n 1)
            reports=$(grep -c 'WARNING: ThreadSanitizer' "$log" || true)
            {
              echo '### Thread Sanitizer'
              echo
              echo "${totals:-No XCTest totals found.}"
              echo
              echo "ThreadSanitizer reports: $reports"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  synthetic-performance:
    if: github.event_name == 'workflow_dispatch' && inputs.synthetic_performance
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Measure synthetic production-code workload
        run: python3 scripts/measure-performance.py --run --profile large --configuration release --samples 3 --output "$RUNNER_TEMP/performance"
      - name: Summarize measurement and provenance
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/performance/summary.md" ]; then
            cat "$RUNNER_TEMP/performance/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve synthetic measurement evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: synthetic-performance-${{ github.sha }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/performance/performance-report.json
            ${{ runner.temp }}/performance/run-summary.json
            ${{ runner.temp }}/performance/build-manifest.json
            ${{ runner.temp }}/performance/summary.md
          retention-days: 14
          if-no-files-found: warn
